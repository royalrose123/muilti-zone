# PLAN §12.3：三個 zone 共用的 NEXTAUTH_SECRET（demo 專用值），只定義一次避免不一致
x-auth-secret: &auth-secret 0evtqn04IQQxY2ssd9FBfORm7B53CxrhkQmWulHnvSY=

services:
  # 模擬後端的帳密驗證服務（PLAN §12.4）：只在內網，瀏覽器不直接呼叫
  auth-api:
    image: node:20.20.2-alpine
    working_dir: /app
    volumes:
      - ./auth-api:/app:ro
    command: ["node", "server.mjs"]
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 模擬後端的會員資料服務（PLAN §13.3）：只在內網，由 C 的 API 呼叫
  member-api:
    image: node:20.20.2-alpine
    working_dir: /app
    volumes:
      - ./member-api:/app:ro
    command: ["node", "server.mjs"]
    expose:
      - "4100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  a:
    build:
      context: ./a
      args:
        SHOP_ZONE_URL: http://b:3001
        BLOG_ZONE_URL: http://c:3002
    environment:
      MENU_FILE: /etc/config/menu.json   # 模擬 K8s 的 configMap volume（PLAN §15）
      NEXTAUTH_SECRET: *auth-secret
      NEXTAUTH_URL: http://localhost:8080
      AUTH_API_URL: http://auth-api:4000
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}   # 驗收過期：SESSION_MAX_AGE=60 npm run docker:redeploy:a
    configs:
      - source: menu
        target: /etc/config/menu.json
    ports:
      - "8080:3000"   # 只有 A 對外
    depends_on:
      b:
        condition: service_started
      c:
        condition: service_started
      auth-api:
        condition: service_started   # 不等 healthy：故意停掉 auth-api 時 A 仍要能啟動

  b:
    build:
      context: ./b
    environment:
      MAIN_ZONE_URL: http://a:3000
      MENU_FALLBACK_FILE: /etc/config/menu.json
      NEXTAUTH_SECRET: *auth-secret
    configs:
      - source: menu
        target: /etc/config/menu.json
    expose:
      - "3001"        # 只在 compose 內網可見
    # 刻意不 depends_on a：A 不通時要能靠備案（自己掛載的同一份 ConfigMap）啟動並服務

  c:
    build:
      context: ./c
    environment:
      MAIN_ZONE_URL: http://a:3000
      MENU_FALLBACK_FILE: /etc/config/menu.json
      NEXTAUTH_SECRET: *auth-secret
      MEMBER_API_URL: http://member-api:4100
      ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8082
    configs:
      - source: menu
        target: /etc/config/menu.json
    expose:
      - "3002"
    depends_on:
      member-api:
        condition: service_started   # 不等 healthy：member-api 停掉時 C 仍要能啟動（widget 顯示錯誤狀態）

# 模擬 K8s ConfigMap：來源是 repo 裡的 deploy/menu.json，唯讀掛進 a、b、c（PLAN §15）。
# 改檔案後要重新建立容器才會生效（npm run docker:redeploy:a），與「改設定要重新部署」的規則一致。
configs:
  menu:
    file: ./deploy/menu.json
